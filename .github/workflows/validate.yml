name: validate

on:
  push:
    branches: [main]
  pull_request:
  # Documentation links (to CAP text, upstream docs, and this repository's own
  # files) can rot without any change here, so recheck them on a schedule in
  # addition to every push and pull request.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    # A scheduled run exists to recheck documentation links, not to re-run
    # structural validation against an unchanged tree.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pinned to an exact patch version so every CI run validates against
          # the same interpreter. Minor-only pinning ("3.11") would float to
          # whatever the newest 3.11.x is at run time, changing the validation
          # target without any commit in this repository. Bump this
          # deliberately when a new patch release is wanted.
          python-version: "3.11.16"

      - name: Structural fixture validation
        run: python3 tools/validate/validate.py

      - name: Fixtures badge is current
        # README.md's fixture-count badge is generated from the fixture tree
        # by tools/badge/badge.py. Fail if a fixture was added or removed
        # without regenerating it, so the count cannot silently drift.
        run: python3 tools/badge/badge.py --check

      - name: Repository tests
        run: python3 -m unittest discover tests -v

  coverage:
    # Branch coverage of tools/ on a single operating system (ubuntu-latest),
    # so the number is comparable between runs (#337). The threshold lives in
    # .coveragerc (`fail_under`, measured against the baseline documented
    # there); this job fails when the report drops below it. Coverage is a
    # development-only dependency: it is installed here in its pinned version
    # and never imported by the tools or the test suite.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Same interpreter pin as the validate job; see its comment.
          python-version: "3.11.16"

      - name: Install pinned coverage
        run: python3 -m pip install --disable-pip-version-check coverage==7.16.2

      - name: Run tests under coverage
        # branch=True and source=tools come from .coveragerc, so this matches
        # the documented local command:
        #   coverage run --branch --source=tools -m unittest discover tests
        run: coverage run -m unittest discover tests

      - name: Coverage report (fails below .coveragerc fail_under)
        # No pipe here: the group's exit status is `coverage report`'s, so a
        # result below the threshold fails this step. The per-file table is
        # appended to the job summary either way.
        run: |
          {
            echo "## Branch coverage of tools/"
            echo
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Covers external links and, because lychee resolves relative paths
          # on disk, this repository's own inter-file links too. Retries and
          # the 429 allowance keep transient host/rate-limit responses from
          # failing an otherwise healthy tree.
          #
          # 502/503/504 is the same allowance for server errors: lychee
          # 0.24.2 (the version this action installs) retries only 429, not
          # 5xx at any --max-retries (lycheeverse/lychee#2319), and github.com
          # intermittently answers 503 to CI runners for commit links that
          # return 200 from everywhere else. Such a response says GitHub was
          # unavailable at that moment, not that the link is broken. 404, 500
          # and every other status still fails the job, and the trade-off is
          # the one 429 already makes: a host that is genuinely down for the
          # whole run passes too.
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --accept 200,206,429,502,503,504
            --exclude 'https://www\.contributor-covenant\.org/.*'
            './**/*.md'
          fail: true

  source-links:
    # Fixture source reference links are checked on schedule only, so
    # routine PRs and pushes are not subject to third-party network flakes.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Check fixture source reference links
        run: python3 tools/validate/check_source_links.py --summary-file "$GITHUB_STEP_SUMMARY"
