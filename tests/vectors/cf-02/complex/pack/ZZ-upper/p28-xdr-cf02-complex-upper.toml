# CF-02 conformance vector "complex": the fixture whose path sorts first and
# whose id sorts last.
#
# What this file is. Test data for CF-02 (fixture registry and pack digest),
# not a behavior fixture; see ../../README.md.
#
# What it pins. This file sits in `ZZ-upper/`. Every byte of a pack-relative
# path participates in the sort, and `Z` (0x5A) is below every lowercase letter,
# so this path is first in the digest input even though its id is last in the
# registry's `fixtures` array. An implementation that sorted paths
# case-insensitively, or that ordered the digest input by id as well, disagrees
# with the golden manifest beside this pack.
#
# Why the XDR body is what it is. Incidental to the vector, as in the other
# packs: Stellar-contract.x declares ContractExecutable's STELLAR_ASSET arm as a
# void payload behind discriminant 1, i.e. the four bytes 00 00 00 01, base64
# "AAAAAQ==". Nothing decodes it here.
#
# Reference: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x

id = "p28-xdr-cf02-complex-upper"
protocol = 28
surface = "xdr"
category = "registry-conformance"
description = "CF-02 vector: path sorts first because of an uppercase directory, id sorts last"
source_reference = "https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x"

type = "ContractExecutable"
kind = "roundtrip"
value_base64 = "AAAAAQ=="
