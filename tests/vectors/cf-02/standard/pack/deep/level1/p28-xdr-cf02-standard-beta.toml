# CF-02 conformance vector "standard": the fixture with both payload references.
#
# What this file is. Test data for CF-02 (fixture registry and pack digest),
# not a behavior fixture; see ../../README.md.
#
# What it pins.
#   * `input_file` and `expected_file` are both set, so this entry's `payloads`
#     array must list `payloads/beta-expected.bin` before
#     `payloads/beta-input.bin` (sorted by path, UTF-8 byte order) -- not in
#     the order the fields appear here -- and both files must appear in the
#     digest input.
#   * Both references are relative to *this file's* directory, so the registry
#     records `deep/level1/payloads/...`, not `payloads/...`.
#   * `required_capabilities` is present and empty. CF-02 section 3 says an
#     absent `requiredCapabilities` equals an empty one; this entry makes the
#     distinction observable, because the registry must mirror an explicit
#     `[]` as `"requiredCapabilities": []` rather than dropping the key.
#   * This file's path sorts before the pack's other fixture while its id sorts
#     after it (see the sibling fixture's header).
#
# Why the XDR body is what it is. As in the minimal vector, the body is
# incidental and must only be well formed: Stellar-contract.x declares
# ContractExecutable's STELLAR_ASSET arm as a void payload behind discriminant
# 1, i.e. the four bytes 00 00 00 01, base64 "AAAAAQ==". The decoded payloads
# are never read by anything -- CF-02 defines the digest over raw bytes, and no
# runner consumes a payload today.
#
# Reference: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x

id = "p28-xdr-cf02-standard-beta"
protocol = 28
surface = "xdr"
category = "registry-conformance"
description = "CF-02 vector: id sorts last, path sorts first, two payloads and an empty capability list"
source_reference = "https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x"
required_capabilities = []
input_file = "payloads/beta-input.bin"
expected_file = "payloads/beta-expected.bin"

type = "ContractExecutable"
kind = "roundtrip"
value_base64 = "AAAAAQ=="
