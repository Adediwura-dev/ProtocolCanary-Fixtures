# Protocol 28 / StellarValue ext: truncated STELLAR_VALUE_SIGNED is rejected.
#
# Complements p28-xdr-stellar-value-signed-roundtrip.toml: a decoder
# that accepts truncated input is as much of a compatibility break as
# one that rejects valid input. The STELLAR_VALUE_SIGNED arm of the
# StellarValue ext union (Stellar-ledger.x at stellar/stellar-xdr tag
# v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694, case at
# lines 45-46) carries a LedgerCloseValueSignature (lines 20-24): a
# NodeID (PublicKey, Stellar-types.x lines 53-57 and 84) followed by a
# Signature (opaque, max 64 bytes, Stellar-types.x line 80).
#
# Malformation rule (documented, deterministic): this value_base64 is
# the first 100 bytes of the 152-byte crate-produced encoding in
# p28-xdr-stellar-value-signed-roundtrip.toml — the complete
# top-level body (txSetHash, closeTime, empty upgrades vector), the
# ext discriminant (1 = STELLAR_VALUE_SIGNED), the complete NodeID
# (discriminant 0 plus the 32-byte ed25519 key), the signature's
# 4-byte length prefix (64) and only the first 12 of the required 64
# signature bytes. The signature is therefore cut short, and a correct
# XDR decoder must reject this as truncated input rather than silently
# accepting a short Signature.
#
# Generated and checked on 2026-10-19 (UTC) with the official
# `stellar-xdr` 28.0.1 crate (features base64 and alloc, the crate
# version Protocol-Canary's canary-xdr pins for Protocol 28; rustc
# 1.99.1 (58cf8f9c3 2026-10-13)): StellarValue::from_xdr_base64
# returns Err ("failed to fill whole buffer") for this input, while
# the unmodified 152-byte encoding it was cut from decodes and
# round-trips successfully with the same crate. The rejection is the
# truncation itself, not an unrecognized ext discriminant.
#
# The source value was built by a program using the pinned crate, with
# the expression recorded in the roundtrip fixture's header; the
# truncation above is the only mutation. Every byte is a synthetic
# structural value, not a capture of a real network object; the node
# id and signature bytes are labelled synthetic in the roundtrip
# fixture's header and no real key material appears here either.
# Nothing here was observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-ledger.x

