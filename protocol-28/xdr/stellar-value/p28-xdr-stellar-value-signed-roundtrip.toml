# Protocol 28 / StellarValue ext: STELLAR_VALUE_SIGNED roundtrip.
#
# The StellarValue union's `ext` has three arms in Stellar-ledger.x at
# stellar/stellar-xdr tag v28.0 (commit
# 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694): enum StellarValueType
# (lines 14-19) and the ext union (lines 41-56). The
# STELLAR_VALUE_SIGNED case (lines 45-46) carries a
# LedgerCloseValueSignature (lines 20-24) — a NodeID naming the node
# that introduced the value and that node's Signature over it. Until
# this fixture existed, this pack covered only the CAP-0083
# STELLAR_VALUE_EMPTY_TX_SET arm, so a decoder that mishandled the
# pre-CAP-0083 arms would pass the pack unnoticed. This fixture proves
# the SIGNED arm round-trips: decoding the value and re-encoding it
# must reproduce exactly these bytes.
#
# Why it matters: the SIGNED arm is how a validator-identified value
# is carried on the wire; the node id and signature must survive a
# decode/encode cycle intact.
#
# The payload was produced by a program that builds the typed value
# with the official `stellar-xdr` 28.0.1 crate (features base64 and
# alloc — the crate version Protocol-Canary's canary-xdr pins for
# Protocol 28) and serialises it, never hand-assembled. Generation
# expression, recorded verbatim (NodeId is `typedef PublicKey NodeID`
# and Signature is `typedef opaque Signature<64>` in Stellar-types.x
# at the same commit, lines 84 and 80; PublicKey is the union at lines
# 53-57):
#
#   StellarValue {
#       tx_set_hash: Hash([0x11; 32]),
#       close_time: TimePoint(1760000000),
#       upgrades: VecM::default(),   // empty upgrades vector
#       ext: StellarValueExt::Signed(LedgerCloseValueSignature {
#           node_id: NodeId(PublicKey::PublicKeyTypeEd25519(
#               Uint256([0x22; 32]))),
#           signature: Signature(vec![0x33; 64].try_into().unwrap()),
#       }),
#   }.to_xdr_base64(Limits::none())
#
# Crate: stellar-xdr 28.0.1; rustc 1.99.1 (58cf8f9c3 2026-10-13);
# generated 2026-10-19 (UTC). The same crate round-tripped the value:
# StellarValue::from_xdr_base64 followed by to_xdr reproduced the
# 152-byte encoding exactly, byte for byte.
#
# Every payload byte is a synthetic structural value, not a capture of
# a real network object: the 0x11-filled txSetHash is not the hash of
# any real transaction set, close_time is an arbitrary fixed uint64
# (not an observed ledger close time), the upgrades vector is empty,
# the 0x22-filled node id is not the key of any real validator node,
# and the 64-byte 0x33-filled signature is filler in the shape of a
# Signature, not a signature over anything. No real or real-looking
# key material is used anywhere in this fixture. Nothing here was
# observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-ledger.x

