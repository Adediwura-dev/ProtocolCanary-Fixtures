# Protocol 28 / CAP-0085: CONTRACT_EXECUTABLE_EXTERNAL_REF.
#
# CAP-0085 lets many contract instances ("a fleet") share and atomically
# upgrade a single Wasm implementation, by adding a new
# ContractExecutableType case, CONTRACT_EXECUTABLE_EXTERNAL_REF
# (discriminant 2), to the ContractExecutable union carried in a contract
# instance's ledger entry. Per the CAP, that case carries a
# ContractExecutableExternalRef struct naming an owner contract address and
# a string tag identifying which persistent storage entry on that owner
# (keyed by an ExecutableTagObject) holds the Wasm hash to actually
# execute:
#
#   union ContractExecutable switch (ContractExecutableType type) {
#   ...
#   case CONTRACT_EXECUTABLE_EXTERNAL_REF:
#       ContractExecutableExternalRef external_ref;
#   };
#
#   struct ContractExecutableExternalRef {
#       SCAddress executable_owner;
#       SCString tag;
#   };
#
# This fixture's value_base64 is a real, well-formed encoding of that
# shape, produced by constructing a stellar_xdr::ContractExecutable value
# in-memory with the official `stellar-xdr` 28.0.0 crate (not hand-
# assembled bytes) and calling to_xdr_base64. executable_owner is
# ScAddress::Contract with an arbitrary 32-byte placeholder hash (strkey
# CBKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVKVLO6Q — not a real
# deployed contract); tag is the arbitrary string "fleet-v1". This fixture
# proves the wire shape round-trips; it does not exercise a real deployed
# externally-managed-executable contract end-to-end (see
# ../../../docs/protocol-28.md for that gap).
#
# Testing this fixture requires Protocol-Canary's canary-xdr crate to
# support the "ContractExecutable" XDR type name, added alongside this
# fixture (previously only "StellarValue" was supported).
#
# Reference: https://github.com/stellar/stellar-protocol/blob/9cd703075d87a6ce293752b1532e7b68efe12ae1/core/cap-0085.md

id = "p28-xdr-cap85-external-ref-roundtrip"
protocol = 28
