# Protocol 28 / ContractExecutable: CONTRACT_EXECUTABLE_WASM decodes.
#
# What this tests: a well-formed ContractExecutable using the
# CONTRACT_EXECUTABLE_WASM case (discriminant 0, body = 32-byte
# wasm_hash) is accepted by a decoder:
#
#   union ContractExecutable switch (ContractExecutableType type) {
#   ...
#   case CONTRACT_EXECUTABLE_WASM:
#       Hash wasm_hash;
#   ...
#   };
#
# Definition: Stellar-contract.x at stellar/stellar-xdr tag v28.0, commit
# 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694: enum ContractExecutableType
# lines 172-177, union ContractExecutable lines 229-237.
#
# Why it matters: decode-success is the floor every other assertion
# builds on. The pack already proves this arm round-trips
# (p28-xdr-contract-executable-wasm-roundtrip); separating the weaker
# property means a regression that refuses to decode at all is caught
# here and named as such, instead of surfacing only as "something is
# wrong with this value" in the roundtrip assertion. It is also the
# assertion kind the validator and the engine both accept while no other
# fixture in the pack used it for ContractExecutable.
#
# What protocol/CAP introduced it: not Protocol 28. The two-case union
# (CONTRACT_EXECUTABLE_WASM = 0, CONTRACT_EXECUTABLE_STELLAR_ASSET = 1)
# is already present in stellar/stellar-xdr tag v20, Protocol 20's XDR
# (https://github.com/stellar/stellar-xdr/blob/v20/Stellar-contract.x,
# checked 2026-10-20 UTC), the protocol CAP-0046 Soroban introduced
# (https://github.com/stellar/stellar-protocol/blob/master/core/cap-0046.md
# shows CREATE_CONTRACT carrying a ContractExecutable). Protocol
# 28's CAP-0085 added only the third case, CONTRACT_EXECUTABLE_EXTERNAL_REF
# (discriminant 2).
#
# Expected result and where it comes from: kind = "decode-success" means
# a decoder must accept value_base64 (round-trip identity is asserted by
# the companion roundtrip fixture). The payload is the same
# crate-produced value as that fixture, built by a program using the
# official `stellar-xdr` Rust crate and serialised, never hand-assembled.
# Generation expression, recorded verbatim:
#
#   ContractExecutable::Wasm(Hash([0xab; 32])).to_xdr_base64(Limits::none())
#
# Crate: stellar-xdr 28.0.1 (features base64 and alloc -- the crate
# version Protocol-Canary's canary-xdr pins for Protocol 28); rustc
# 1.99.1 (58cf8f9c3 2026-10-13); generated 2026-10-20 (UTC). With that
# crate, ContractExecutable::from_xdr_base64 returns Ok for this payload.
#
# Is it deterministic: yes. The 0xab-filled hash is a fixed placeholder
# chosen by the generator, which uses no randomness, clock or network;
# the same expression always yields the same base64.
#
# Every payload byte is a synthetic structural value, not a capture of a
# real network object: the 0xab-filled wasmHash is not the hash of any
# real uploaded Wasm and does not identify a real contract, account or
# ledger entry. Nothing here was observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x

id = "p28-xdr-contract-executable-wasm-decode-success"
protocol = 28
surface = "xdr"
category = "contract-executable"
description = "A well-formed ContractExecutable using the CONTRACT_EXECUTABLE_WASM case decodes successfully"
source_reference = "https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x"

type = "ContractExecutable"
kind = "decode-success"
value_base64 = "AAAAAKurq6urq6urq6urq6urq6urq6urq6urq6urq6urq6ur"
