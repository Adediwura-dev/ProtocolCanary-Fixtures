# Protocol 28 / ContractExecutable: CONTRACT_EXECUTABLE_STELLAR_ASSET roundtrip.
#
# What this tests: a ContractExecutable whose discriminant is
# CONTRACT_EXECUTABLE_STELLAR_ASSET (1) round-trips byte for byte. That
# case carries no body, so its whole encoding is the 4-byte discriminant:
#
#   union ContractExecutable switch (ContractExecutableType type) {
#   ...
#   case CONTRACT_EXECUTABLE_STELLAR_ASSET:
#       void;
#   ...
#   };
#
# Definition: Stellar-contract.x at stellar/stellar-xdr tag v28.0, commit
# 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694: enum ContractExecutableType
# lines 172-177 (CONTRACT_EXECUTABLE_STELLAR_ASSET = 1), union
# ContractExecutable lines 229-237.
#
# Why it matters: until this fixture existed, the pack's ContractExecutable
# coverage was only the CAP-0085 ExternalRef case. A union's body-less
# case is exactly where an encoder that always writes a body (or a
# decoder that always expects one) goes wrong, and that error would
# corrupt every contract instance whose executable is the Stellar Asset
# Contract rather than uploaded Wasm. This fixture proves the arm decodes
# and re-encodes to the same four bytes.
#
# What protocol/CAP introduced it: not Protocol 28. The two-case union
# (CONTRACT_EXECUTABLE_WASM = 0, CONTRACT_EXECUTABLE_STELLAR_ASSET = 1)
# is already present in stellar/stellar-xdr tag v20, Protocol 20's XDR
# (https://github.com/stellar/stellar-xdr/blob/v20/Stellar-contract.x,
# checked 2026-10-20 UTC), the protocol CAP-0046 Soroban introduced
# (https://github.com/stellar/stellar-protocol/blob/master/core/cap-0046.md
# shows CREATE_CONTRACT carrying a ContractExecutable). Protocol
# 28's CAP-0085 added only the third case, CONTRACT_EXECUTABLE_EXTERNAL_REF
# (discriminant 2).
#
# Expected result and where it comes from: kind = "roundtrip" means a
# decoder must accept this value and re-encoding it must reproduce
# value_base64 byte for byte. The bytes were produced by a program that
# builds the typed value with the official `stellar-xdr` Rust crate and
# serialises it, never hand-assembled. Generation expression, recorded
# verbatim:
#
#   ContractExecutable::StellarAsset.to_xdr_base64(Limits::none())
#
# Crate: stellar-xdr 28.0.1 (features base64 and alloc -- the crate
# version Protocol-Canary's canary-xdr pins for Protocol 28); rustc
# 1.99.1 (58cf8f9c3 2026-10-13); generated 2026-10-20 (UTC). The same
# program asserted the crate's own round trip with this value:
# ContractExecutable::from_xdr_base64 returned Ok, decoded to the
# StellarAsset variant, and re-encoding reproduced all 4 bytes exactly.
#
# Is it deterministic: yes. The value is a bare discriminant with no
# payload, so it carries no data at all, let alone anything that varies;
# the generator uses no randomness, clock or network.
#
# This fixture is a synthetic structural value, not a capture of a real
# network object: it asserts the wire encoding of one union case and
# names no real contract, account, asset or ledger entry. Nothing here
# was observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x

id = "p28-xdr-contract-executable-stellar-asset-roundtrip"
protocol = 28
surface = "xdr"
category = "contract-executable"
description = "ContractExecutable using the CONTRACT_EXECUTABLE_STELLAR_ASSET case round-trips byte-for-byte"
source_reference = "https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x"

type = "ContractExecutable"
kind = "roundtrip"
value_base64 = "AAAAAQ=="
