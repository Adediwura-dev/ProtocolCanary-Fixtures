# Protocol 28 / ContractExecutable: truncated CONTRACT_EXECUTABLE_STELLAR_ASSET is rejected.
#
# What this tests: a truncated ContractExecutable::StellarAsset encoding
# is rejected rather than silently accepted:
#
#   union ContractExecutable switch (ContractExecutableType type) {
#   ...
#   case CONTRACT_EXECUTABLE_STELLAR_ASSET:
#       void;
#   ...
#   };
#
# Definition: Stellar-contract.x at stellar/stellar-xdr tag v28.0, commit
# 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694: enum ContractExecutableType
# lines 172-177 (CONTRACT_EXECUTABLE_STELLAR_ASSET = 1), union
# ContractExecutable lines 229-237.
#
# Why it matters: a decoder that accepts truncated input is as much of a
# compatibility break as one that rejects valid input. This case's whole
# encoding is its 4-byte union discriminant, so a decoder that reads the
# discriminant from too few bytes -- or that accepts a partially read
# discriminant as if it were a complete one -- would silently accept
# input that is not a valid XDR value at all.
#
# Malformation rule (documented, deterministic): this value_base64 is
# the first 3 bytes of the 4-byte crate-produced encoding in
# p28-xdr-contract-executable-stellar-asset-roundtrip.toml -- only 3 of
# the 4 discriminant bytes (00 00 00), with the fourth byte and the
# value's end-of-input check missing. A correct XDR decoder must reject
# it, because an XDR union discriminant is a fixed 4-byte int that cannot
# be read from 3 bytes. The truncation is a whole number of base64
# groups, so the fixture's value_base64 is literally the first 4
# characters of the well-formed one ("AAAAAQ==" starts with "AAAA"), and
# it is not an empty value.
#
# Expected result and where it comes from: kind = "decode-failure" means
# a decoder must refuse this value. Verified against the official
# `stellar-xdr` 28.0.1 crate (features base64 and alloc -- the crate
# version Protocol-Canary's canary-xdr pins for Protocol 28; rustc 1.99.1
# (58cf8f9c3 2026-10-13)): ContractExecutable::from_xdr_base64 returns
# Err ("failed to fill whole buffer") for this input, while the unmodified
# 4-byte encoding it was cut from decodes and round-trips with the same
# crate. Generated and checked 2026-10-20 (UTC). The rejection is the
# truncation itself; the discriminant is present but incomplete.
#
# The source value was built by a program using the pinned crate, with
# the expression recorded in the roundtrip fixture's header
# (ContractExecutable::StellarAsset); the truncation above is the only
# mutation. This fixture is a synthetic structural value, not a capture
# of a real network object. Nothing here was observed on a network.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x

